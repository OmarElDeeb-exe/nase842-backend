name: Backend CI

on:
  pull_request:
  push:
    branches: [main, review-remediation-ci]

permissions:
  contents: read

jobs:
  tests:
    name: Flask API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: realworlddb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d realworlddb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: ci-local-only
      POSTGRES_HOST: localhost
      POSTGRES_DB: realworlddb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.5
          poetry config virtualenvs.create false
          poetry install --with dev --no-root --no-interaction --no-ansi

      - name: Prepare test database
        run: poetry run alembic upgrade head

      - name: Run all backend API tests
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          poetry run pytest tests/api -q

      - name: Check Python for critical errors
        run: poetry run ruff check realworld tests --select E4,E7,E9,F63,F7,F82
