name: Verify Backend Changes

on:
  push:
    branches:
      - assessment-fixes-username-cors-ireland-cd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: realworlddb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d realworlddb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: realworlddb
      POSTGRES_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==1.8.5
          poetry config virtualenvs.create false
          poetry install --with dev --no-root --no-interaction --no-ansi

      - name: Initialize isolated test database
        run: poetry run alembic upgrade head

      - name: Check account and CORS regressions
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          poetry run pytest tests/api/test_users.py tests/api/test_cors.py -v
